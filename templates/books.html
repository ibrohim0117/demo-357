<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitoblar</title>
    <style>
        body {
            max-width: 700px;
            margin: 0 auto;
            padding: 32px 16px;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f5f5f5;
        }

        h1 {
            margin: 0 0 24px;
        }

        .book {
            margin-bottom: 16px;
            padding: 16px 20px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .book h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .book p {
            margin: 0;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Kitoblar</h1>

    {% for book in books %}
        <div class="book">
            <h2>{{ book.name }}</h2>
            <p>{{ book.about }}</p>
        </div>
    {% empty %}
        <p>Hozircha kitoblar yo'q.</p>
    {% endfor %}
</body>
</html>
